project_name: "p1_tensor_autograd"

data:
  data_dir: "./data/raw"
  batch_size: 128
  val_ratio: 0.1
  num_classes: 10

model:
  name: "tensor_mlp"         # Bản 1: Tensor + Autograd thuần túy
  hidden_1: 256
  hidden_2: 128

train:
  seeds: [42, 43, 44]
  epochs: 30
  patience: 5

  optimizer:
    name: "sgd"
    lr: 0.1

  scheduler:
    name: "none"

output:
  checkpoint_dir: "./outputs/checkpoints_tensor"
  log_dir: "./outputs/logs_tensor"
  figure_dir: "./outputs/figures_tensor"
