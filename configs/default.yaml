project_name: "p1_mnist_mlp"

data:
  data_dir: "./data/raw"
  batch_size: 128
  val_ratio: 0.1
  num_classes: 10

model:
  name: "mlp"                # "mlp" (Bản nn.Module) hoặc "tensor_mlp" (Bản Tensor thuần)
  hidden_1: 256
  hidden_2: 128
  init_mode: "default"       # "default", "zeros", "large"

train:
  seeds: [42, 43, 44]        # Chạy 3 seed theo quy tắc lộ trình để lấy mean ± std
  epochs: 30
  patience: 5                # Early stopping theo Validation metric

  optimizer:
    name: "sgd"
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0
    nesterov: false

  scheduler:
    name: "none"             # P1 chạy SGD cố định

output:
  checkpoint_dir: "./outputs/checkpoints"
  log_dir: "./outputs/logs"
  figure_dir: "./outputs/figures"
